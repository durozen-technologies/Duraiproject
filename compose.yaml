# LedgerDesk — production Compose stack
#
# All three services publish host ports (configurable to avoid collisions with
# other stacks on the same Dokploy host — e.g. existing FastAPI on :8000 / Postgres on :5432).
#
# Defaults chosen to avoid common conflicts:
#   FRONTEND_PUBLISH_PORT=8080  → http://HOST:8080
#   BACKEND_PUBLISH_PORT=8001   → http://HOST:8001
#   POSTGRES_PUBLISH_PORT=5433  → HOST:5433
#
# Set EXPO_PUBLIC_API_URL to the publicly reachable backend URL before building,
# e.g. http://YOUR_SERVER_IP:8001/api or https://api.yourdomain.com/api

name: ledgerdesk

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerdesk_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerdesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ledgerdesk-backend:latest
    restart: unless-stopped
    environment:
      PRODUCTION: "True"
      # Reach Postgres by Compose DNS name (never localhost inside the network)
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-ledgerdesk_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerdesk}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the environment}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      PROJECT_NAME: ${PROJECT_NAME:-LedgerDesk}
      VERSION: ${VERSION:-0.1.0}
      API_V1_STR: ${API_V1_STR:-/api/v1}
    ports:
      - "${BACKEND_PUBLISH_PORT:-8001}:8000"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend_mobile
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time — must match the public backend URL
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8001/api}
    image: ledgerdesk-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PUBLISH_PORT:-8080}:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
